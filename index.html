<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>South Florida Kosher Restaurant Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root{
    --ink:#202124;
    --muted:#5f6368;
    --line:#e3e5e8;
    --panel:#ffffff;
    --bg:#f5f6f7;
    --accent:#1a6b5c;
    --accent-soft:#e6f2ef;
    --radius:10px;
    --shadow:0 1px 2px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    height:100dvh; overflow:hidden;
  }
  #app{ position:relative; height:100dvh; width:100vw; }
  #map{ position:absolute; inset:0; }

  header{
    position:absolute; top:0; left:0; right:0; z-index:1000;
    padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
    gap:10px; pointer-events:none;
  }
  header h1{
    margin:0; font-size:1.05rem; font-weight:600; letter-spacing:-0.01em;
    background:var(--panel); padding:9px 14px; border-radius:999px; box-shadow:var(--shadow);
    pointer-events:auto;
  }
  header .updated{
    font-size:.72rem; color:var(--muted); background:var(--panel); padding:7px 12px;
    border-radius:999px; box-shadow:var(--shadow); white-space:nowrap; pointer-events:auto;
  }

  #panel{
    position:absolute; top:64px; left:16px; bottom:16px; width:300px; z-index:900;
    background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow);
    overflow-y:auto; padding:12px 16px 18px;
    display:flex; flex-direction:column;
  }
  .panel-actions{
    display:flex; gap:8px; padding-bottom:10px; margin-bottom:8px; border-bottom:1px solid var(--line);
  }
  .panel-actions button{
    flex:1; font-family:inherit; font-size:.78rem; font-weight:600; padding:7px 0;
    border-radius:7px; border:1px solid var(--line); background:#fafafa; color:var(--ink); cursor:pointer;
  }
  .panel-actions button:hover{ background:var(--accent-soft); border-color:var(--accent); }
  .panel-actions button.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .panel-actions button.primary:hover{ opacity:.9; }

  .group{ margin-bottom:6px; border-bottom:1px solid var(--line); }
  .group:last-of-type{ border-bottom:none; }
  .group summary{
    list-style:none; cursor:pointer; padding:10px 2px;
    font-size:.8rem; font-weight:600; color:var(--ink); text-transform:uppercase; letter-spacing:.04em;
    display:flex; align-items:center; justify-content:space-between;
  }
  .group summary::-webkit-details-marker{ display:none; }
  .group summary::after{ content:"▾"; color:var(--muted); font-size:.7rem; transition:transform .15s; }
  .group[open] summary::after{ transform:rotate(180deg); }
  .group-body{ padding:0 2px 10px; }
  .group-hint{ font-size:.72rem; color:var(--muted); padding:0 2px 6px; }

  label.chip{
    display:flex; align-items:center; gap:9px; padding:6px 4px;
    font-size:.86rem; cursor:pointer; user-select:none; border-radius:6px;
  }
  label.chip:hover{ background:var(--accent-soft); }
  label.chip input{ accent-color: var(--accent); width:16px; height:16px; flex-shrink:0; }
  .swatch{ width:10px; height:10px; border-radius:50%; display:inline-block; flex-shrink:0; }

  #count{
    font-size:.75rem; color:var(--muted); margin-top:8px; padding-top:10px;
    border-top:1px solid var(--line);
  }

  .leaflet-popup-content-wrapper{ border-radius:8px; }
  .leaflet-popup-content{ font-family:inherit; font-size:.85rem; line-height:1.45; margin:12px 14px; }
  .leaflet-popup-content b{ font-size:.98rem; }
  .tag{
    display:inline-block; font-size:.66rem; padding:2px 7px; border-radius:5px;
    margin:2px 4px 0 0; color:#fff; font-weight:500;
  }

  #filters-toggle{ display:none; }

  @media (max-width: 760px){
    header h1{ font-size:.92rem; padding:8px 12px; }
    header .updated{ display:none; }

    #panel{
      display:none;
      top:auto; left:0; right:0; bottom:0; width:100%;
      max-height:75dvh; border-radius:16px 16px 0 0;
      padding-top:6px;
    }
    #panel.open{ display:flex; }
    #panel::before{
      content:""; display:block; width:36px; height:4px; background:var(--line);
      border-radius:99px; margin:4px auto 10px;
    }

    #filters-toggle{
      display:flex; align-items:center; gap:8px;
      position:absolute; bottom:20px; left:50%; transform:translateX(-50%); z-index:950;
      background:var(--accent); color:#fff; border:none; padding:11px 20px;
      border-radius:999px; box-shadow:var(--shadow); font-size:.88rem; font-weight:600;
      font-family:inherit;
    }
  }
</style>
</head>
<body>

<div id="app">
  <div id="map"></div>

  <header>
    <h1>South Florida Kosher</h1>
    <span class="updated" id="updated-label">Loading…</span>
  </header>

  <div id="panel">
    <div class="panel-actions">
      <button class="primary" id="select-all-btn">Select all</button>
      <button id="clear-btn">Clear filters</button>
    </div>

    <details class="group" open>
      <summary>Food Type</summary>
      <div class="group-body">
        <label class="chip"><input type="checkbox" class="f-food_type" value="Dairy"><span class="swatch" style="background:#1a6b5c"></span>Dairy</label>
        <label class="chip"><input type="checkbox" class="f-food_type" value="Meat"><span class="swatch" style="background:#b5473a"></span>Meat</label>
        <label class="chip"><input type="checkbox" class="f-food_type" value="Parve"><span class="swatch" style="background:#8a6d1f"></span>Parve</label>
      </div>
    </details>

    <details class="group" open>
      <summary>Food Service</summary>
      <div class="group-body">
        <label class="chip"><input type="checkbox" class="f-food_service" value="Restaurant"><span class="swatch" style="background:#3d5a99"></span>Restaurant</label>
        <label class="chip"><input type="checkbox" class="f-food_service" value="Bakery"><span class="swatch" style="background:#8a5a34"></span>Bakery</label>
        <label class="chip"><input type="checkbox" class="f-food_service" value="Take Out"><span class="swatch" style="background:#3d7a4d"></span>Take Out</label>
        <label class="chip"><input type="checkbox" class="f-food_service" value="Drinks and Snacks"><span class="swatch" style="background:#c78a2e"></span>Drinks and Snacks</label>
      </div>
    </details>

    <details class="group">
      <summary>Commercial &amp; Wholesale</summary>
      <div class="group-body">
        <label class="chip"><input type="checkbox" class="f-commercial" value="Catering"><span class="swatch" style="background:#5a5a8a"></span>Catering</label>
        <label class="chip"><input type="checkbox" class="f-commercial" value="Commercial"><span class="swatch" style="background:#6b6b6b"></span>Commercial</label>
        <label class="chip"><input type="checkbox" class="f-commercial" value="Grocery"><span class="swatch" style="background:#3d6b7a"></span>Grocery</label>
        <label class="chip"><input type="checkbox" class="f-commercial" value="Butcher"><span class="swatch" style="background:#8a2f2f"></span>Butcher</label>
        <label class="chip"><input type="checkbox" class="f-commercial" value="Manufacturing"><span class="swatch" style="background:#6b6b6b"></span>Manufacturing</label>
        <label class="chip"><input type="checkbox" class="f-commercial" value="Wholesale Distribution"><span class="swatch" style="background:#8a8a8a"></span>Wholesale Distribution</label>
        <label class="chip"><input type="checkbox" class="f-commercial" value="Wholesale Only"><span class="swatch" style="background:#8a8a8a"></span>Wholesale Only</label>
        <label class="chip"><input type="checkbox" class="f-commercial" value="Food Additives"><span class="swatch" style="background:#8a8a8a"></span>Food Additives</label>
        <label class="chip"><input type="checkbox" class="f-commercial" value="Misc"><span class="swatch" style="background:#8a8a8a"></span>Misc</label>
      </div>
    </details>

    <details class="group" open>
      <summary>Stringencies</summary>
      <div class="group-hint">Stricter standards some people specifically look for</div>
      <div class="group-body">
        <label class="chip"><input type="checkbox" class="f-stringency" value="Cholov Yisroel"><span class="swatch" style="background:#1a6b5c"></span>Cholov Yisroel</label>
        <label class="chip"><input type="checkbox" class="f-stringency" value="Pas Yisroel"><span class="swatch" style="background:#8a6d1f"></span>Pas Yisroel</label>
        <label class="chip"><input type="checkbox" class="f-stringency" value="Yoshon"><span class="swatch" style="background:#5a5a8a"></span>Yoshon</label>
      </div>
    </details>

    <details class="group" open>
      <summary>Certifying Agency</summary>
      <div class="group-body" id="agency-filters"></div>
    </details>

    <div id="count"></div>
  </div>

  <button id="filters-toggle" onclick="document.getElementById('panel').classList.toggle('open')">
    Filters
  </button>
</div>

<script>
const CATEGORY_COLORS = {
  "Dairy": "#1a6b5c", "Meat": "#b5473a", "Parve": "#8a6d1f",
  "Restaurant": "#3d5a99", "Bakery": "#8a5a34", "Take Out": "#3d7a4d", "Drinks and Snacks": "#c78a2e",
  "Catering": "#5a5a8a", "Commercial": "#6b6b6b", "Grocery": "#3d6b7a", "Butcher": "#8a2f2f",
  "Manufacturing": "#6b6b6b", "Wholesale Distribution": "#8a8a8a", "Wholesale Only": "#8a8a8a",
  "Food Additives": "#8a8a8a", "Misc": "#8a8a8a",
  "Cholov Yisroel": "#1a6b5c", "Pas Yisroel": "#8a6d1f", "Yoshon": "#5a5a8a",
};
const AGENCY_LABELS = { "ORB": "ORB", "KM": "KM", "KDM": "KDM", "SSK": "Sunshine State Kosher" };

const map = L.map('map', { zoomControl: false }).setView([25.95, -80.15], 10);
L.control.zoom({ position: 'bottomright' }).addTo(map);

// Esri's Light Gray Canvas basemap - clean, minimal, no API key required
// (unlike CARTO's basemaps, which now require an account/key for this kind
// of hosted usage).
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
  maxZoom: 16,
}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 16,
}).addTo(map);

let allData = [];
let markers = [];

function colorFor(rec){
  const ft = rec.food_type || [], fs = rec.food_service || [], cm = rec.commercial || [];
  const first = ft[0] || fs[0] || cm[0] || "";
  return CATEGORY_COLORS[first] || "#666";
}

function buildAgencyFilters(data){
  const agencies = new Set(data.map(r => r.agency));
  const box = document.getElementById('agency-filters');
  [...agencies].sort().forEach(a => {
    const id = 'ag-' + a;
    box.insertAdjacentHTML('beforeend', `
      <label class="chip" for="${id}">
        <input type="checkbox" id="${id}" class="f-agency" value="${a}"> ${AGENCY_LABELS[a] || a}
      </label>`);
  });
}

function allFilterCheckboxes(){
  return document.querySelectorAll('.f-food_type,.f-food_service,.f-commercial,.f-stringency,.f-agency');
}

function render(){
  const active = {
    food_type: [...document.querySelectorAll('.f-food_type:checked')].map(e=>e.value),
    food_service: [...document.querySelectorAll('.f-food_service:checked')].map(e=>e.value),
    commercial: [...document.querySelectorAll('.f-commercial:checked')].map(e=>e.value),
    stringency: [...document.querySelectorAll('.f-stringency:checked')].map(e=>e.value),
  };
  const activeAgencies = [...document.querySelectorAll('.f-agency:checked')].map(e=>e.value);

  markers.forEach(m => map.removeLayer(m));
  markers = [];

  let shown = 0;
  allData.forEach(r => {
    if (!r.lat || !r.lon) return;

    // Food Type is the one required filter - a restaurant with any food
    // type tag must match your selection there, or it's hidden. This is
    // what keeps the map from dumping everything on you before you've
    // chosen anything.
    const ft = r.food_type || [];
    if (ft.length && !ft.some(t => active.food_type.includes(t))) return;

    // Every other group only constrains results once you've actually
    // checked something in it - leaving a group untouched means "don't
    // filter by this," not "hide everything with this tag."
    for (const dim of ["food_service","commercial","stringency"]) {
      if (!active[dim].length) continue;
      const tags = r[dim] || [];
      if (tags.length && !tags.some(t => active[dim].includes(t))) return;
    }
    if (activeAgencies.length && !activeAgencies.includes(r.agency)) return;

    const color = colorFor(r);
    const marker = L.circleMarker([r.lat, r.lon], {
      radius: 6, color: '#fff', weight: 2, fillColor: color, fillOpacity: 0.95,
    });
    const allTags = [...(r.food_type||[]), ...(r.food_service||[]), ...(r.commercial||[]), ...(r.stringency||[])];
    const tagHtml = allTags.map(c => `<span class="tag" style="background:${CATEGORY_COLORS[c]||'#888'}">${c}</span>`).join("");
    marker.bindPopup(`
      <b>${r.name}</b><br>
      ${r.address || r.area || ""}<br>
      ${r.phone ? r.phone + "<br>" : ""}
      ${tagHtml}<br>
      <span style="color:#5f6368;">Certified by ${AGENCY_LABELS[r.agency] || r.agency} (${r.source})</span>
      ${r.cert_link ? `<br><a href="${r.cert_link}" target="_blank">View certificate</a>` : ""}
    `);
    marker.addTo(map);
    markers.push(marker);
    shown++;
  });

  document.getElementById('count').textContent = `Showing ${shown} of ${allData.length} restaurants`;

  // Frame the view around whatever actually matched, so phones (narrow,
  // tall screens) and desktops (wide screens) both see all matching pins
  // rather than a fixed center/zoom that happens to crop differently on
  // different screen shapes.
  if (markers.length) {
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.15), { maxZoom: 13 });
  }
}

document.getElementById('select-all-btn').addEventListener('click', () => {
  allFilterCheckboxes().forEach(cb => cb.checked = true);
  render();
});
document.getElementById('clear-btn').addEventListener('click', () => {
  allFilterCheckboxes().forEach(cb => cb.checked = false);
  render();
});

function fixMapSize(){ map.invalidateSize(); }
window.addEventListener('resize', fixMapSize);
window.addEventListener('orientationchange', () => setTimeout(fixMapSize, 200));
setTimeout(fixMapSize, 300);

fetch('data/restaurants.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    allData = data;
    buildAgencyFilters(data);
    document.querySelectorAll('.f-food_type,.f-food_service,.f-commercial,.f-stringency,.f-agency')
      .forEach(el => el.addEventListener('change', render));
    render();
    fixMapSize();
    document.getElementById('updated-label').textContent =
      'Updates daily • ' + new Date().toLocaleDateString();
  })
  .catch(err => {
    document.getElementById('updated-label').textContent = 'Failed to load data';
    console.error(err);
  });
</script>
</body>
</html>
