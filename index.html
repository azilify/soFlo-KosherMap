<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>South Florida Kosher Restaurant Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root{
    --ink:#1c2b2d;
    --paper:#f6f3ec;
    --line:#d9d2c2;
    --meat:#a3402f;
    --dairy:#2f6a6b;
    --parve:#8a7a3f;
    --agency:#3a3a3a;
    --accent:#c98a3f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Iowan Old Style","Georgia",serif;
    background:var(--paper); color:var(--ink);
  }
  header{
    padding:18px 20px 14px; border-bottom:2px solid var(--ink);
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }
  header h1{
    margin:0; font-size:1.35rem; letter-spacing:.02em; font-weight:600;
  }
  header .updated{
    font-family:"Helvetica Neue",Arial,sans-serif; font-size:.75rem; color:#5a5a52;
  }
  #layout{ display:flex; height:calc(100vh - 60px); }
  #panel{
    width:280px; min-width:220px; overflow-y:auto; padding:14px 16px;
    border-right:2px solid var(--ink); background:var(--paper);
    font-family:"Helvetica Neue",Arial,sans-serif;
  }
  #map{ flex:1; }
  .group{ margin-bottom:18px; }
  .group h2{
    font-family:"Iowan Old Style","Georgia",serif;
    font-size:.85rem; text-transform:uppercase; letter-spacing:.08em;
    margin:0 0 8px; border-bottom:1px solid var(--line); padding-bottom:4px;
  }
  label.chip{
    display:flex; align-items:center; gap:8px; padding:5px 2px;
    font-size:.85rem; cursor:pointer; user-select:none;
  }
  label.chip input{ accent-color: var(--accent); width:15px; height:15px; }
  .swatch{ width:10px; height:10px; border-radius:50%; display:inline-block; flex-shrink:0; }
  #count{
    font-size:.75rem; color:#5a5a52; margin-top:10px; padding-top:10px;
    border-top:1px solid var(--line);
  }
  .leaflet-popup-content{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:.85rem; line-height:1.4; }
  .leaflet-popup-content b{ font-family:"Iowan Old Style","Georgia",serif; font-size:1rem; }
  .tag{
    display:inline-block; font-size:.68rem; padding:1px 6px; border-radius:3px;
    margin:2px 3px 0 0; color:#fff;
  }
  @media (max-width: 700px){
    #layout{ flex-direction:column; height:auto; }
    #panel{ width:100%; border-right:none; border-bottom:2px solid var(--ink); max-height:38vh; }
    #map{ height:62vh; }
  }
</style>
</head>
<body>

<header>
  <h1>South Florida Kosher Restaurants</h1>
  <span class="updated" id="updated-label">Loading data…</span>
</header>

<div id="layout">
  <div id="panel">
    <div class="group">
      <h2>Food Category</h2>
      <div id="category-filters"></div>
    </div>
    <div class="group">
      <h2>Certifying Agency</h2>
      <div id="agency-filters"></div>
    </div>
    <div class="group">
      <h2>Dairy Standard</h2>
      <label class="chip"><input type="checkbox" class="std-filter" value="Cholov Yisroel" checked><span class="swatch" style="background:var(--dairy)"></span>Cholov Yisroel</label>
      <label class="chip"><input type="checkbox" class="std-filter" value="Cholov Stam" checked><span class="swatch" style="background:#b5ab8a"></span>Cholov Stam</label>
    </div>
    <div id="count"></div>
  </div>
  <div id="map"></div>
</div>

<script>
const CATEGORY_COLORS = {
  "Meat": "#a3402f",
  "Dairy": "#2f6a6b",
  "Parve": "#8a7a3f",
  "Pareve": "#8a7a3f",
  "Bakery": "#7a5a3a",
  "Catering": "#5a5a8a",
  "Take Out": "#4a7a4a",
  "Commercial": "#777",
  "Butcher": "#8a2f2f",
  "Grocery": "#5a7a8a",
  "Misc": "#999",
  "Wholesale Only": "#999",
};
const AGENCY_COLORS = { "ORB":"#3a3a3a", "KM":"#3a3a3a", "KDM":"#3a3a3a" };

const map = L.map('map').setView([25.95, -80.15], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19,
}).addTo(map);

let allData = [];
let markers = [];

function colorFor(categoryString){
  const first = categoryString.split(",")[0].trim();
  return CATEGORY_COLORS[first] || "#666";
}

function buildFilters(data){
  const cats = new Set();
  const agencies = new Set();
  data.forEach(r => {
    r.category.split(",").forEach(c => {
      const c2 = c.trim();
      if (c2 && !["Cholov Yisroel","Cholov Stam"].includes(c2)) cats.add(c2);
    });
    agencies.add(r.agency);
  });

  const catBox = document.getElementById('category-filters');
  [...cats].sort().forEach(c => {
    const id = 'cat-' + c.replace(/\s+/g,'-');
    catBox.insertAdjacentHTML('beforeend', `
      <label class="chip" for="${id}">
        <input type="checkbox" id="${id}" class="cat-filter" value="${c}" checked>
        <span class="swatch" style="background:${CATEGORY_COLORS[c]||'#666'}"></span>${c}
      </label>`);
  });

  const agBox = document.getElementById('agency-filters');
  [...agencies].sort().forEach(a => {
    const id = 'ag-' + a;
    agBox.insertAdjacentHTML('beforeend', `
      <label class="chip" for="${id}">
        <input type="checkbox" id="${id}" class="ag-filter" value="${a}" checked> ${a}
      </label>`);
  });

  document.querySelectorAll('.cat-filter,.ag-filter,.std-filter')
    .forEach(el => el.addEventListener('change', render));
}

function render(){
  const activeCats = [...document.querySelectorAll('.cat-filter:checked')].map(e=>e.value);
  const activeAgencies = [...document.querySelectorAll('.ag-filter:checked')].map(e=>e.value);
  const activeStds = [...document.querySelectorAll('.std-filter:checked')].map(e=>e.value);

  markers.forEach(m => map.removeLayer(m));
  markers = [];

  let shown = 0;
  allData.forEach(r => {
    if (!r.lat || !r.lon) return;
    const rowCats = r.category.split(",").map(c=>c.trim());
    const hasStdTag = rowCats.includes("Cholov Yisroel") || rowCats.includes("Cholov Stam");
    const foodCats = rowCats.filter(c => !["Cholov Yisroel","Cholov Stam"].includes(c));

    const catMatch = foodCats.some(c => activeCats.includes(c));
    const agMatch = activeAgencies.includes(r.agency);
    // dairy-standard filter only constrains rows that actually carry a standard tag
    const stdMatch = !hasStdTag || rowCats.some(c => activeStds.includes(c));

    if (catMatch && agMatch && stdMatch){
      const color = colorFor(r.category);
      const marker = L.circleMarker([r.lat, r.lon], {
        radius: 6, color: '#1c2b2d', weight: 1, fillColor: color, fillOpacity: 0.85,
      });
      const tags = rowCats.map(c => `<span class="tag" style="background:${CATEGORY_COLORS[c]||'#888'}">${c}</span>`).join("");
      marker.bindPopup(`
        <b>${r.name}</b><br>
        ${r.address || r.area || ""}<br>
        ${r.phone ? r.phone + "<br>" : ""}
        ${tags}<br>
        <span style="color:#777;">Certified by ${r.agency} (${r.source})</span>
        ${r.cert_link ? `<br><a href="${r.cert_link}" target="_blank">View certificate</a>` : ""}
      `);
      marker.addTo(map);
      markers.push(marker);
      shown++;
    }
  });

  document.getElementById('count').textContent = `Showing ${shown} of ${allData.length} restaurants`;
}

fetch('data/restaurants.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    allData = data;
    buildFilters(data);
    render();
    document.getElementById('updated-label').textContent =
      'Data refreshes daily • ' + new Date().toLocaleDateString();
  })
  .catch(err => {
    document.getElementById('updated-label').textContent = 'Failed to load data — see console';
    console.error(err);
  });
</script>
</body>
</html>
