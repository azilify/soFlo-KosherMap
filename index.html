<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>South Florida Kosher Restaurant Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root{
    --ink:#202124;
    --muted:#5f6368;
    --line:#e3e5e8;
    --panel:#ffffff;
    --bg:#f5f6f7;
    --accent:#1a6b5c;
    --accent-soft:#e6f2ef;
    --meat:#b5473a;
    --dairy:#1a6b5c;
    --parve:#8a6d1f;
    --bakery:#8a5a34;
    --other:#5f6368;
    --radius:10px;
    --shadow:0 1px 2px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    height:100dvh; overflow:hidden;
  }
  #app{ position:relative; height:100dvh; width:100vw; }
  #map{ position:absolute; inset:0; }

  header{
    position:absolute; top:0; left:0; right:0; z-index:1000;
    padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
    gap:10px; pointer-events:none;
  }
  header h1{
    margin:0; font-size:1.05rem; font-weight:600; letter-spacing:-0.01em;
    background:var(--panel); padding:9px 14px; border-radius:999px; box-shadow:var(--shadow);
    pointer-events:auto;
  }
  header .updated{
    font-size:.72rem; color:var(--muted); background:var(--panel); padding:7px 12px;
    border-radius:999px; box-shadow:var(--shadow); white-space:nowrap; pointer-events:auto;
  }

  /* Desktop sidebar */
  #panel{
    position:absolute; top:64px; left:16px; bottom:16px; width:300px; z-index:900;
    background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow);
    overflow-y:auto; padding:14px 16px 18px;
  }
  .group{ margin-bottom:6px; border-bottom:1px solid var(--line); }
  .group:last-of-type{ border-bottom:none; }
  .group summary{
    list-style:none; cursor:pointer; padding:10px 2px;
    font-size:.8rem; font-weight:600; color:var(--ink); text-transform:uppercase; letter-spacing:.04em;
    display:flex; align-items:center; justify-content:space-between;
  }
  .group summary::-webkit-details-marker{ display:none; }
  .group summary::after{ content:"▾"; color:var(--muted); font-size:.7rem; transition:transform .15s; }
  .group[open] summary::after{ transform:rotate(180deg); }
  .group-body{ padding:0 2px 10px; }

  label.chip{
    display:flex; align-items:center; gap:9px; padding:6px 4px;
    font-size:.86rem; cursor:pointer; user-select:none; border-radius:6px;
  }
  label.chip:hover{ background:var(--accent-soft); }
  label.chip input{ accent-color: var(--accent); width:16px; height:16px; flex-shrink:0; }
  .swatch{ width:10px; height:10px; border-radius:50%; display:inline-block; flex-shrink:0; }

  #count{
    font-size:.75rem; color:var(--muted); margin-top:8px; padding-top:10px;
    border-top:1px solid var(--line);
  }

  .leaflet-popup-content-wrapper{ border-radius:8px; }
  .leaflet-popup-content{ font-family:inherit; font-size:.85rem; line-height:1.45; margin:12px 14px; }
  .leaflet-popup-content b{ font-size:.98rem; }
  .tag{
    display:inline-block; font-size:.66rem; padding:2px 7px; border-radius:5px;
    margin:2px 4px 0 0; color:#fff; font-weight:500;
  }

  /* Mobile: floating Filters button + bottom-sheet panel */
  #filters-toggle{ display:none; }

  @media (max-width: 760px){
    header h1{ font-size:.92rem; padding:8px 12px; }
    header .updated{ display:none; }

    #panel{
      display:none;
      top:auto; left:0; right:0; bottom:0; width:100%;
      max-height:70dvh; border-radius:16px 16px 0 0;
      padding-top:6px;
    }
    #panel.open{ display:block; }
    #panel::before{
      content:""; display:block; width:36px; height:4px; background:var(--line);
      border-radius:99px; margin:4px auto 10px;
    }

    #filters-toggle{
      display:flex; align-items:center; gap:8px;
      position:absolute; bottom:20px; left:50%; transform:translateX(-50%); z-index:950;
      background:var(--accent); color:#fff; border:none; padding:11px 20px;
      border-radius:999px; box-shadow:var(--shadow); font-size:.88rem; font-weight:600;
      font-family:inherit;
    }
  }
</style>
</head>
<body>

<div id="app">
  <div id="map"></div>

  <header>
    <h1>South Florida Kosher</h1>
    <span class="updated" id="updated-label">Loading…</span>
  </header>

  <div id="panel">
    <details class="group" open>
      <summary>Food Service</summary>
      <div class="group-body" id="cat-group-food"></div>
    </details>
    <details class="group">
      <summary>Commercial &amp; Wholesale</summary>
      <div class="group-body" id="cat-group-commercial"></div>
    </details>
    <details class="group" id="cat-group-other-wrap" style="display:none;">
      <summary>Other</summary>
      <div class="group-body" id="cat-group-other"></div>
    </details>
    <details class="group" open>
      <summary>Certifying Agency</summary>
      <div class="group-body" id="agency-filters"></div>
    </details>
    <details class="group" open>
      <summary>Dairy Standard</summary>
      <div class="group-body">
        <label class="chip"><input type="checkbox" class="std-filter" value="Cholov Yisroel" checked><span class="swatch" style="background:var(--dairy)"></span>Cholov Yisroel</label>
        <label class="chip"><input type="checkbox" class="std-filter" value="Cholov Stam" checked><span class="swatch" style="background:#b5ab8a"></span>Cholov Stam</label>
      </div>
    </details>
    <div id="count"></div>
  </div>

  <button id="filters-toggle" onclick="document.getElementById('panel').classList.toggle('open')">
    Filters
  </button>
</div>

<script>
// Categories that belong to hands-on food service vs. commercial/wholesale-type listings.
const FOOD_SERVICE_CATS = new Set([
  "Meat","Dairy","Parve","Pareve","Bakery","Catering","Take Out","Butcher"
]);
const COMMERCIAL_CATS = new Set([
  "Commercial","Wholesale Only","Wholesale Distribution","Food Additives",
  "Manufacturing","Grocery","Misc"
]);

const CATEGORY_COLORS = {
  "Meat": "#b5473a", "Dairy": "#1a6b5c", "Parve": "#8a6d1f", "Pareve": "#8a6d1f",
  "Bakery": "#8a5a34", "Catering": "#5a5a8a", "Take Out": "#3d7a4d",
  "Commercial": "#6b6b6b", "Butcher": "#8a2f2f", "Grocery": "#3d6b7a",
  "Misc": "#8a8a8a", "Wholesale Only": "#8a8a8a", "Wholesale Distribution": "#8a8a8a",
  "Food Additives": "#8a8a8a", "Manufacturing": "#6b6b6b",
};

const map = L.map('map', { zoomControl: false }).setView([25.95, -80.15], 10);
L.control.zoom({ position: 'bottomright' }).addTo(map);

// Clean, minimal basemap (CARTO Positron) instead of default OSM styling.
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
  maxZoom: 19,
  subdomains: 'abcd',
}).addTo(map);

let allData = [];
let markers = [];

function colorFor(categoryString){
  const first = categoryString.split(",")[0].trim();
  return CATEGORY_COLORS[first] || "#666";
}

function buildFilters(data){
  const cats = new Set();
  const agencies = new Set();
  data.forEach(r => {
    (r.category || "").split(",").forEach(c => {
      const c2 = c.trim();
      if (c2 && !["Cholov Yisroel","Cholov Stam"].includes(c2)) cats.add(c2);
    });
    agencies.add(r.agency);
  });

  const foodBox = document.getElementById('cat-group-food');
  const commBox = document.getElementById('cat-group-commercial');
  const otherBox = document.getElementById('cat-group-other');
  let hasOther = false;

  [...cats].sort().forEach(c => {
    const id = 'cat-' + c.replace(/[^a-zA-Z0-9]+/g,'-');
    const html = `
      <label class="chip" for="${id}">
        <input type="checkbox" id="${id}" class="cat-filter" value="${c}" checked>
        <span class="swatch" style="background:${CATEGORY_COLORS[c]||'#666'}"></span>${c}
      </label>`;
    if (FOOD_SERVICE_CATS.has(c)) foodBox.insertAdjacentHTML('beforeend', html);
    else if (COMMERCIAL_CATS.has(c)) commBox.insertAdjacentHTML('beforeend', html);
    else { otherBox.insertAdjacentHTML('beforeend', html); hasOther = true; }
  });
  if (hasOther) document.getElementById('cat-group-other-wrap').style.display = 'block';

  const agBox = document.getElementById('agency-filters');
  [...agencies].sort().forEach(a => {
    const id = 'ag-' + a;
    agBox.insertAdjacentHTML('beforeend', `
      <label class="chip" for="${id}">
        <input type="checkbox" id="${id}" class="ag-filter" value="${a}" checked> ${a}
      </label>`);
  });

  document.querySelectorAll('.cat-filter,.ag-filter,.std-filter')
    .forEach(el => el.addEventListener('change', render));
}

function render(){
  const activeCats = [...document.querySelectorAll('.cat-filter:checked')].map(e=>e.value);
  const activeAgencies = [...document.querySelectorAll('.ag-filter:checked')].map(e=>e.value);
  const activeStds = [...document.querySelectorAll('.std-filter:checked')].map(e=>e.value);

  markers.forEach(m => map.removeLayer(m));
  markers = [];

  let shown = 0;
  allData.forEach(r => {
    if (!r.lat || !r.lon) return;
    const rowCats = (r.category || "").split(",").map(c=>c.trim());
    const hasStdTag = rowCats.includes("Cholov Yisroel") || rowCats.includes("Cholov Stam");
    const foodCats = rowCats.filter(c => !["Cholov Yisroel","Cholov Stam"].includes(c));

    const catMatch = foodCats.some(c => activeCats.includes(c));
    const agMatch = activeAgencies.includes(r.agency);
    const stdMatch = !hasStdTag || rowCats.some(c => activeStds.includes(c));

    if (catMatch && agMatch && stdMatch){
      const color = colorFor(r.category || "");
      const marker = L.circleMarker([r.lat, r.lon], {
        radius: 6, color: '#fff', weight: 2, fillColor: color, fillOpacity: 0.95,
      });
      const tags = rowCats.map(c => `<span class="tag" style="background:${CATEGORY_COLORS[c]||'#888'}">${c}</span>`).join("");
      marker.bindPopup(`
        <b>${r.name}</b><br>
        ${r.address || r.area || ""}<br>
        ${r.phone ? r.phone + "<br>" : ""}
        ${tags}<br>
        <span style="color:${getComputedStyle(document.documentElement).getPropertyValue('--muted')};">Certified by ${r.agency} (${r.source})</span>
        ${r.cert_link ? `<br><a href="${r.cert_link}" target="_blank">View certificate</a>` : ""}
      `);
      marker.addTo(map);
      markers.push(marker);
      shown++;
    }
  });

  document.getElementById('count').textContent = `Showing ${shown} of ${allData.length} restaurants`;
}

// Leaflet can mis-measure its container if the map div's size isn't final
// yet when it initializes (common on mobile). Force a re-check after layout
// settles and on any viewport change.
function fixMapSize(){ map.invalidateSize(); }
window.addEventListener('resize', fixMapSize);
window.addEventListener('orientationchange', () => setTimeout(fixMapSize, 200));
setTimeout(fixMapSize, 300);

fetch('data/restaurants.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    allData = data;
    buildFilters(data);
    render();
    fixMapSize();
    document.getElementById('updated-label').textContent =
      'Updates daily • ' + new Date().toLocaleDateString();
  })
  .catch(err => {
    document.getElementById('updated-label').textContent = 'Failed to load data';
    console.error(err);
  });
</script>
</body>
</html>
